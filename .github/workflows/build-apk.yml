name: Build Jernih APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        run: |
          curl -L -o jernih.zip "https://muse.ai/files/1451609868034060/1794361581885783/j7p2ta1ibxok102y78sgub5z/jernih-android.zip"
          unzip -q jernih.zip
          ls jernih-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools/tmp"
          mv "$HOME/android-sdk/cmdline-tools/tmp/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          rm -rf "$HOME/android-sdk/cmdline-tools/tmp" cmdtools.zip
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: jernih-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jernih-apk
          path: jernih-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
