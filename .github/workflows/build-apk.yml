name: Build Jernih APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        run: |
          curl -L -o jernih.zip "https://muse.ai/files/1451609868034060/2005423046815020/ce32ufkj9t5q50idjuoso0fx/jernih-android.zip"
          unzip -q jernih.zip
          ls jernih-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: jernih-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jernih-apk
          path: jernih-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
